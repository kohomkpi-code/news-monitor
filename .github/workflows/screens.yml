# 화면 확인용: main 에 push 되면 윈도우에서 앱 화면을 찍어 ci-screens 브랜치에 올린다.
# (실제 윈도우 글꼴·배율에서 어떻게 보이는지 개발 중에 확인하려고. 배포와는 상관없음)

name: screens

on:
  push:
    branches: [main]
    paths: ["*.py", "assets/**", "tests/screens.py", ".github/workflows/screens.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screens:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 부품 설치
        run: pip install -r requirements.txt pillow
      - name: 화면 찍기
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/screens.py
      - name: ci-screens 브랜치에 올리기
        run: |
          cd screens
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "screens for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-screens
